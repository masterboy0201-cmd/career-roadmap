<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Career Roadmap</title>

  <!-- Fonts from Google Fonts: Anton (headings), Inter (text), JetBrains Mono (small labels) -->
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600&family=JetBrains+Mono&display=swap" rel="stylesheet">

  <style>
  /* ---- COLORS: change the look of the whole site here (light, then dark) ---- */
  :root {
    --bg: #f4f4f2;
    --fg: #111;
    --mu: #555;
    --ln: #111;
    --dot: 17,17,17;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top,0px);
    padding-bottom: env(safe-area-inset-bottom,0px);
  }

  :root[data-theme=dark] {
    --bg: #0e0e0e;
    --fg: #f4f4f2;
    --mu: #aaa;
    --ln: #f4f4f2;
    --dot: 244,244,242;
  }

  /* ---- BASE ---- */
  * {
    box-sizing: border-box;
  }

  html {
    scroll-behavior: smooth;
    scroll-padding-top: 70px;
  }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font: 16px/1.6 Inter,system-ui,sans-serif;
  }

  /* ---- HALFTONE BACKGROUND (canvas) ---- */
  #texture {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: -1;
    pointer-events: none;
  }

  /* ---- HEADINGS AND TEXT ---- */
  h1,
  h2,
  h3,
  h4 {
    font-family: Anton,Oswald,Impact,sans-serif;
    font-weight: 400;
    line-height: .95;
    margin: 0;
  }

  /* ---- HEADINGS AND TEXT ---- */
  h1,
  h2 {
    text-align: center;
    font-size: clamp(40px,9vw,88px);
  }

  h2 {
    font-size: clamp(32px,6vw,56px);
    margin-bottom: 32px;
  }

  h3 {
    font-size: clamp(26px,4vw,36px);
    margin-bottom: 20px;
  }

  h4 {
    font-size: 20px;
    margin: 20px 0 6px;
    letter-spacing: .02em;
  }

  p {
    color: var(--mu);
  }

  a {
    color: inherit;
  }

  .mono,
  small,
  .big-number {
    font-family: 'JetBrains Mono',monospace;
  }

  .mono,
  small {
    font-size: 12px;
  }

  /* ---- NAVIGATION BAR ---- */
  nav {
    position: fixed;
    top: env(safe-area-inset-top,0px);
    left: 0;
    right: 0;
    z-index: 5;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 20px;
    background: var(--bg);
    border-bottom: 1px solid var(--ln);
  }

  .brand {
    font-weight: 600;
    text-decoration: none;
    margin-right: auto;
  }

  .menu {
    display: flex;
    align-items: center;
    gap: 28px;
    flex: 1;
  }

  .nav-links {
    display: flex;
    gap: 24px;
    margin: auto;
    font-size: 14px;
  }

  .nav-links a {
    text-decoration: none;
  }

  .nav-actions {
    display: flex;
    align-items: center;
    gap: 14px;
  }

  #menu-button {
    display: none;
  }

  .link-button {
    background: none;
    border: 0;
    color: inherit;
    font: inherit;
    font-size: 14px;
    cursor: pointer;
    padding: 0;
  }

  /* ---- BUTTONS ---- */
  .button {
    display: inline-block;
    border: 1px solid var(--ln);
    border-radius: 99px;
    padding: .65em 1.3em;
    font: 500 14px Inter,sans-serif;
    cursor: pointer;
    background: var(--bg);
    color: var(--fg);
    text-decoration: none;
  }

  .button.primary {
    background: var(--fg);
    color: var(--bg);
  }

  /* ---- HERO (top of every page) ---- */
  .hero {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    padding: 120px 20px 40px;
    position: relative;
    overflow: hidden;
    gap: 20px;
  }

  .hero p {
    max-width: 560px;
    margin: 0;
  }

  .hero.compact {
    min-height: 0;
  }

  .hero.home {
    padding-top: 14vh;
  }

  .shield {
    position: absolute;
    bottom: -60px;
    left: 50%;
    transform: translateX(-50%);
    width: min(640px,95vw);
    color: var(--fg);
    z-index: -1;
  }

  .keyhole {
    fill: var(--bg);
  }

  /* ---- PRACTICE STRIP ---- */
  .strip {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-items: center;
    gap: 12px 28px;
    padding: 28px 20px;
    border-block: 1px solid var(--ln);
    background: var(--bg);
    color: #888;
    font-weight: 600;
  }

  .strip small {
    font-weight: 400;
  }

  /* ---- PAGE LAYOUT, CARDS, GRID ---- */
  .wrap {
    max-width: 960px;
    margin: 0 auto;
    padding: 56px 20px;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit,minmax(230px,1fr));
    gap: 16px;
  }

  .card {
    border: 1px solid var(--ln);
    padding: 20px;
    background: var(--bg);
    color: var(--fg);
    text-align: left;
    font: inherit;
    display: flex;
    flex-direction: column;
    gap: 12px;
    align-items: flex-start;
  }

  .card ul {
    margin: 0;
    padding-left: 18px;
    flex: 1;
    color: var(--mu);
    font-size: 14px;
  }

  .card .progress {
    width: 100%;
  }

  .big-number {
    font: 64px/1 Anton,sans-serif;
  }

  button.specialization {
    cursor: pointer;
  }

  .specialization p {
    font-size: 13px;
    margin: 0;
    color: inherit;
  }

  .specialization.selected {
    background: var(--fg);
    color: var(--bg);
  }

  /* ---- TIMELINE ---- */
  .timeline {
    list-style: none;
    max-width: 640px;
    margin: 0 auto;
    padding: 0 0 0 24px;
    border-left: 1px solid var(--ln);
  }

  .timeline li {
    position: relative;
    margin-bottom: 32px;
  }

  .timeline li:before {
    content: '';
    position: absolute;
    left: -30px;
    top: 6px;
    width: 11px;
    height: 11px;
    border-radius: 50%;
    background: var(--fg);
  }

  .timeline b,
  .timeline span {
    display: block;
  }

  .timeline span {
    color: var(--mu);
  }

  /* ---- YEAR PAGE SECTIONS AND CHECKBOXES ---- */
  .section {
    border-top: 1px solid var(--ln);
    padding: 36px 0;
  }

  .check {
    display: flex;
    gap: 10px;
    padding: 5px 0;
    cursor: pointer;
  }

  .check input {
    accent-color: var(--fg);
    margin-top: 5px;
    flex: none;
  }

  /* ---- PROGRESS BARS ---- */
  .progress-wide {
    width: 100%;
    max-width: 420px;
  }

  .progress {
    margin: 12px 0;
  }

  .bar {
    height: 4px;
    background: rgba(128,128,128,.35);
  }

  .bar .fill {
    display: block;
    height: 100%;
    width: 0;
    background: var(--fg);
  }

  /* ---- ACCORDIONS ---- */
  details {
    border: 1px solid var(--ln);
    padding: 12px 16px;
    margin-bottom: 10px;
  }

  summary {
    cursor: pointer;
    font-weight: 600;
  }

  /* ---- CHIPS, TABLE, NOTES BOX ---- */
  .chips {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }

  .chips span {
    border: 1px solid var(--ln);
    border-radius: 99px;
    padding: 3px 12px;
    font-size: 13px;
  }

  table {
    width: 100%;
    border-collapse: collapse;
  }

  td,
  th {
    border-bottom: 1px solid var(--ln);
    padding: 8px 4px;
    text-align: left;
  }

  textarea {
    width: 100%;
    min-height: 140px;
    background: transparent;
    color: inherit;
    border: 1px solid var(--ln);
    padding: 12px;
    font: inherit;
  }

  /* ---- LEGAL FOOTER ---- */
  .legal {
    border-top: 1px solid var(--ln);
    padding: 24px 20px;
    text-align: center;
    font-size: 13px;
    color: var(--mu);
  }

  /* ---- RESET CONFIRMATION DIALOG ---- */
  #confirm {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(0,0,0,.5);
    z-index: 9;
  }

  #confirm[hidden] {
    display: none;
  }

  #confirm div {
    background: var(--bg);
    border: 1px solid var(--ln);
    padding: 24px;
    max-width: 340px;
  }

  /* ---- MOBILE (narrow screens) ---- */
  @media(max-width:820px) {
    #menu-button {
      display: block;
    }
    .menu {
      display: none;
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      background: var(--bg);
      flex-direction: column;
      align-items: flex-start;
      padding: 16px 20px;
      border-bottom: 1px solid var(--ln);
    }
    .nav-links {
      flex-direction: column;
      margin: 0;
    }
    nav.menu-open .menu {
      display: flex;
    }
  }

  /* ---- PRINT ---- */
  @media print {
    body {
      background: #fff !important;
    }
    #texture,
    nav,
    .shield,
    #confirm {
      display: none !important;
    }
    * {
      color: #000 !important;
      background: #fff !important;
      border-color: #000 !important;
    }
    .bar .fill {
      background: #000 !important;
    }
    .hero {
      min-height: 0;
      padding-top: 20px;
    }
  }

  </style>
</head>

<body>
  <canvas id="texture"></canvas>

  <nav id="nav">
    <a class="brand" href="#/">Career Roadmap®</a>
    <div class="menu">
      <div class="nav-links">
        <a href="#/y1">Year 1</a>
        <a href="#/y2">Year 2</a>
        <a href="#/y3">Year 3</a>
        <a href="#/y4">Year 4</a>
        <a href="#/progress">Progress</a>
      </div>
      <div class="nav-actions">
        <button class="link-button" id="reset-button">Reset</button>
        <a class="button primary" href="#/y1">Start Year 1 ↗</a>
      </div>
    </div>
    <button class="link-button" id="theme-button" aria-label="Toggle dark mode">◐</button>
    <button class="link-button" id="menu-button" aria-label="Menu">☰</button>
  </nav>

  <!-- The active page is drawn into this element by the script below -->
  <main id="app"></main>

  <!-- Reset confirmation dialog -->
  <div id="confirm" hidden>
    <div>
      <p>Reset all progress, notes and track choice? This cannot be undone.</p>
      <button class="button" id="confirm-no">Cancel</button>
      <button class="button primary" id="confirm-yes">Reset</button>
    </div>
  </div>

  <script>
/* =====================================================================
   1. ROADMAP  -  ALL SITE CONTENT
   Edit text here; no layout code needs to change.
   Each year has these fields:
     theme, goal, weeklyHours      short texts
     outcomes                      3 lines shown on the home page card
     specializationTracks          Year 4 only: name, skills, certifications, roles, capstone
     skills                        { "Group name": [skill, skill, ...] }  (checkboxes)
     phases                        4 items: months, focus, tasks (checkboxes), deliverable
     tools, resources              lists shown as chips (names only)
     projects                      checkboxes
     certifications                one text
     weeklyTimeSplit               [{ label, hours }]  total is calculated
     exitCriteria                  checkboxes
     selfCheck                     [{ question, answer }]
     commonMistakes                list
   Checkbox IDs come from list position, so add new items at the END of a
   list. Reordering or deleting items shifts IDs and misaligns saved progress.
   ===================================================================== */

const ROADMAP = {
  years: [

    // ================= YEAR 1 =================
    {
      theme: "Fundamentals, Linux, Communication",
      goal: "Build the technical base (networking, Linux, security concepts), learn to document work, and set up a lab and public profiles.",
      weeklyHours: "12 (Linux 3, Networking 3, Security basics 2, Communication 2, Lab write-ups 2)",
      outcomes: [
        "Subnet by hand; explain a URL load end to end",
        "OverTheWire Bandit through level 25; 10 write-ups",
        "Home lab with 3+ VMs and a network diagram"
      ],
      skills: {
        "Computer fundamentals": [
          "Number systems, ASCII/Unicode; CPU, RAM, storage; boot process",
          "OS: processes, threads, scheduling, virtual memory, file systems",
          "Virtualization: VM vs container; Windows basics (Event Viewer, registry, PowerShell)"
        ],
        Networking: [
          "OSI and TCP/IP, encapsulation; Ethernet, ARP, switches vs routers",
          "IPv4, CIDR, subnetting by hand, NAT, DHCP; IPv6 basics",
          "DNS resolution and record types; TCP handshake vs UDP; ICMP",
          "HTTP methods, status codes, cookies; TLS handshake (high level)",
          "Common ports (22, 53, 80, 443, 445, 3389); firewalls, proxies, VPNs",
          "Wireshark capture and filters; Nmap basics"
        ],
        Linux: [
          "Filesystem hierarchy; core commands; pipes and redirection; grep, sed, awk",
          "Permissions (chmod, SUID, umask); users, groups, sudo",
          "Processes, systemd, cron; logs (journalctl, auth.log); apt",
          "Bash scripting; SSH key auth, scp, port forwarding"
        ],
        "Security basics": [
          "CIA triad, AAA, threat vs vulnerability vs risk, least privilege",
          "Attack types at concept level: phishing, malware, DoS, MitM, SQLi, XSS",
          "Symmetric vs asymmetric crypto, hashing, salting, signatures, PKI",
          "MFA; awareness of MITRE ATT&CK, OWASP, CVE, CVSS"
        ],
        "Communication and setup": [
          "Lab write-up format: objective, environment, steps, evidence, findings, remediation",
          "Markdown and a note system; explain one concept aloud for 2 minutes weekly",
          "GitHub profile with a lab-writeups repository; complete LinkedIn profile",
          "Home lab (Kali, Ubuntu Server, Windows evaluation VM, isolated network, snapshots)",
          "Password manager and 2FA on all accounts"
        ]
      },
      phases: [
        {
          months: "1-3",
          focus: "Setup, fundamentals, Linux basics",
          tasks: [
            "Create GitHub and LinkedIn profiles",
            "Build Ubuntu and Kali VMs with snapshots",
            "Complete Linux Journey; OverTheWire Bandit levels 0-10",
            "TryHackMe Pre Security path",
            "Write 3 lab write-ups"
          ],
          deliverable: "2 snapshotted VMs and 3 write-ups on GitHub."
        },
        {
          months: "4-6",
          focus: "Networking",
          tasks: [
            "Study OSI/TCP-IP, ARP, DHCP, DNS, TCP/UDP",
            "Solve 50 subnetting problems by hand (suggested)",
            "Packet Tracer lab: 2 subnets joined by a router",
            "Annotate Wireshark captures of DNS, HTTP and a TCP handshake",
            "Bandit levels 11-20"
          ],
          deliverable: "'Journey of a packet' write-up with annotated capture."
        },
        {
          months: "7-9",
          focus: "Linux depth, scripting, crypto basics",
          tasks: [
            "Permissions, users, groups and SUID labs",
            "5 bash scripts: backup, failed-login counter, ping sweep, user audit, disk report",
            "SSH key auth between two VMs",
            "Hash files, encrypt with GPG, use openssl",
            "Bandit levels 21-25 and beyond"
          ],
          deliverable: "Repository with 5 bash scripts, each with README and usage example."
        },
        {
          months: "10-12",
          focus: "Security basics, Windows, communication",
          tasks: [
            "TryHackMe Cyber Security 101 (path names change; verify on the platform)",
            "Run Nmap against your own lab only",
            "Deliver one 10-minute technical talk",
            "Reach 10 total write-ups; draft resume v1",
            "Write a Year 1 retrospective"
          ],
          deliverable: "10 write-ups and the retrospective."
        }
      ],
      tools: [
        "VirtualBox or VMware",
        "Ubuntu",
        "Kali Linux",
        "Wireshark",
        "Nmap",
        "Cisco Packet Tracer",
        "VS Code",
        "Git",
        "GPG",
        "openssl"
      ],
      resources: [
        "Linux Journey",
        "OverTheWire Bandit",
        "TryHackMe",
        "The Linux Command Line (Shotts)",
        "Professor Messer",
        "CS50",
        "NPTEL networking and OS courses",
        "Cisco Networking Academy"
      ],
      projects: [
        "Documented home lab with network diagram",
        "10 lab write-ups",
        "Bash toolkit repository",
        "Packet journey write-up",
        "Personal knowledge base"
      ],
      certifications: "None required. Optional: CompTIA A+ or Network+, Cisco CCST Cybersecurity, Google Cybersecurity Certificate, TryHackMe Pre Security. Verify current objectives on the official site.",
      weeklyTimeSplit: [
        {
          label: "Linux",
          hours: 3
        },
        {
          label: "Networking",
          hours: 3
        },
        {
          label: "Security basics",
          hours: 2
        },
        {
          label: "Communication",
          hours: 2
        },
        {
          label: "Lab write-ups",
          hours: 2
        }
      ],
      exitCriteria: [
        "Subnet any IPv4 network by hand in under 2 minutes",
        "Explain URL-to-page (DNS, TCP, TLS, HTTP) without notes",
        "Bandit completed through level 25",
        "10 lab write-ups on GitHub",
        "Repository with 5 bash scripts",
        "TryHackMe Pre Security completed",
        "Home lab with 3+ VMs and a network diagram",
        "GitHub and LinkedIn profiles complete",
        "One 10-minute technical talk delivered"
      ],
      selfCheck: [
        {
          question: "TCP vs UDP?",
          answer: "TCP: connection-oriented, reliable, ordered (web, SSH). UDP: connectionless, no delivery guarantee, low overhead (DNS, streaming)."
        },
        {
          question: "What does chmod 4755 do?",
          answer: "Sets SUID plus rwxr-xr-x. The file runs with its owner's privileges."
        },
        {
          question: "Usable hosts in a /26?",
          answer: "62 (64 addresses minus network and broadcast)."
        },
        {
          question: "What is stored in /etc/shadow?",
          answer: "Password hashes and password aging data, readable only by root."
        },
        {
          question: "Symmetric vs asymmetric encryption?",
          answer: "Symmetric: one shared key, fast. Asymmetric: public/private key pair, used for key exchange and signatures."
        }
      ],
      commonMistakes: [
        "Watching tutorials without doing labs",
        "Skipping subnetting",
        "Copy-pasting commands without understanding them",
        "Not writing notes or write-ups",
        "Collecting certificates instead of building skills",
        "Scanning systems without permission"
      ]
    },

    // ================= YEAR 2 =================
    {
      theme: "Programming and DSA",
      goal: "Write working code in Python and C, solve 150+ DSA problems, and start web security and CTFs.",
      weeklyHours: "13 (DSA 4, Python 3, C 2, Web security and CTFs 3, SQL/JS/Git 1)",
      outcomes: [
        "150+ DSA problems across the target distribution",
        "3 security tools and 1 C project on GitHub",
        "20+ PortSwigger labs, 30+ picoCTF challenges"
      ],
      skills: {
        Python: [
          "Data structures, OOP, file I/O, exceptions, venv",
          "requests, socket, subprocess, argparse, re, hashlib, scapy basics",
          "Automation: log parsing, port scanner (own lab only); pytest, README"
        ],
        C: [
          "Pointers, structs, malloc/free, file I/O; gcc, make, gdb",
          "Stack frame and return address; why strcpy is unsafe",
          "Read simple disassembly with objdump"
        ],
        "SQL, JavaScript, Git": [
          "SELECT, JOIN, GROUP BY, indexes, normalization; parameterized queries",
          "DOM, fetch, cookies, same-origin policy, CORS",
          "Git branching and pull requests; never commit secrets"
        ],
        "DSA (suggested 150+)": [
          "Big-O; arrays, strings, hashing: 50 problems",
          "Linked lists, stacks, queues, recursion: 34 problems",
          "Binary search, sorting, trees, heaps: 38 problems",
          "Graphs, union-find, DP basics: 30 problems",
          "6 timed contests; 30-minute cap per problem before hints"
        ],
        "Web security and CTFs": [
          "HTTP in depth, sessions, JWT concepts; latest OWASP Top 10 (check current edition)",
          "Burp Suite Community; Juice Shop and DVWA run locally",
          "PortSwigger Apprentice labs; vulnerability report format",
          "picoCTF categories; CTFtime events; write up every solve"
        ]
      },
      phases: [
        {
          months: "1-3",
          focus: "Python and Git",
          tasks: [
            "Python fundamentals through OOP; Git workflow",
            "DSA: Big-O, arrays, strings, hashing (30 problems)",
            "Tool 1: file integrity checker (SHA-256 baseline and compare)",
            "Password strength checker and log parser"
          ],
          deliverable: "Tool 1 on GitHub with README and tests."
        },
        {
          months: "4-6",
          focus: "C, SQL, systems thinking",
          tasks: [
            "C: pointers, memory, structs, gdb; string utilities and a small file tool",
            "SQL on SQLite and MySQL or PostgreSQL",
            "DSA: lists, stacks, queues, recursion, binary search (45 problems)",
            "Tool 2: multithreaded TCP port scanner, tested on your own lab"
          ],
          deliverable: "C repository and Tool 2."
        },
        {
          months: "7-9",
          focus: "Web security",
          tasks: [
            "JavaScript, DOM, same-origin policy",
            "Read the OWASP Top 10; set up Burp, Juice Shop, DVWA locally",
            "At least 20 PortSwigger Apprentice labs",
            "DSA: trees, heaps, sorting (45 problems)",
            "Tool 3: HTTP security header analyzer or log anomaly detector"
          ],
          deliverable: "One professional web vulnerability report plus Tool 3."
        },
        {
          months: "10-12",
          focus: "Graphs, DP, CTFs",
          tasks: [
            "DSA: graphs and DP; reach 150+ total",
            "picoCTF: at least 30 challenges",
            "Play at least 2 live beginner-friendly CTFs from CTFtime",
            "Timed contests; polish all repositories"
          ],
          deliverable: "10 CTF write-ups and polished repositories."
        }
      ],
      tools: [
        "Python 3",
        "VS Code",
        "gcc",
        "gdb",
        "make",
        "Git/GitHub",
        "Burp Suite Community",
        "Wireshark",
        "Nmap",
        "SQLite",
        "Docker",
        "pytest"
      ],
      resources: [
        "Automate the Boring Stuff with Python",
        "CS50x and CS50P",
        "Beej's Guide to C",
        "NeetCode 150",
        "Striver's A2Z DSA sheet",
        "LeetCode",
        "SQLBolt",
        "PortSwigger Web Security Academy",
        "OWASP Juice Shop",
        "DVWA",
        "picoCTF",
        "CTFtime"
      ],
      projects: [
        "Tool 1: file integrity checker",
        "Tool 2: multithreaded port scanner",
        "Tool 3: header analyzer or log anomaly detector",
        "C utility project",
        "Web vulnerability report"
      ],
      certifications: "None required. Optional: Python Institute PCEP/PCAP, TryHackMe Jr Penetration Tester path. Security+ study can start at year end. Verify objectives on the official site.",
      weeklyTimeSplit: [
        {
          label: "DSA",
          hours: 4
        },
        {
          label: "Python",
          hours: 3
        },
        {
          label: "C",
          hours: 2
        },
        {
          label: "Web security and CTFs",
          hours: 3
        },
        {
          label: "SQL/JavaScript/Git",
          hours: 1
        }
      ],
      exitCriteria: [
        "150+ DSA problems matching the distribution",
        "3 security tools, each with README, usage example and tests",

/* =====================================================================
   2. SAVED STATE
   Everything the site remembers lives in one object and is stored in
   the browser's localStorage. If storage is blocked, the site still
   works but forgets everything on reload.
   ===================================================================== */

const STORAGE_KEY = "cr1";
const YEARS = ROADMAP.years;

const state = {
  checked: {},  // ticked checkboxes, e.g. { "y1-s1-1": true }
  notes: {},    // notes text per year, e.g. { y1: "my notes" }
  track: null,  // chosen Year 4 specialization, e.g. "DFIR"
  theme: null   // "light", "dark", or null to follow the system setting
};

function loadState() {
  try {
    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
    // Short keys (c, n, sp, t) are kept so older saves and exports still load.
    state.checked = saved.c || {};
    state.notes = saved.n || {};
    state.track = saved.sp || null;
    state.theme = saved.t || null;
  } catch (error) {
    // Storage blocked or data corrupt: start empty.
  }
}

function saveState() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      c: state.checked, n: state.notes, sp: state.track, t: state.theme
    }));
  } catch (error) {
    // Storage blocked: ignore.
  }
}

/* =====================================================================
   3. CHECKBOX IDS AND PROGRESS
   Every checkbox has an ID built from its position in ROADMAP:
     skills    y1-s2-3   (year 1, skill group 2, item 3)
     tasks     y1-p2-t3  (year 1, phase 2, task 3)
     projects  y1-pr3
     exit      y1-e3
   Add new items at the END of a list so saved IDs stay correct.
   ===================================================================== */

const skillId   = (year, group, item) => `y${year}-s${group}-${item}`;
const taskId    = (year, phase, task) => `y${year}-p${phase}-t${task}`;
const projectId = (year, item) => `y${year}-pr${item}`;
const exitId    = (year, item) => `y${year}-e${item}`;

// For each year, list all checkbox IDs grouped by section.
const checkboxIds = YEARS.map((year, index) => {
  const n = index + 1;
  return {
    skills: Object.values(year.skills).flatMap((items, group) =>
      items.map((_, item) => skillId(n, group + 1, item + 1))),
    phases: year.phases.map((phase, p) =>
      phase.tasks.map((_, t) => taskId(n, p + 1, t + 1))),
    projects: year.projects.map((_, item) => projectId(n, item + 1)),
    exit: year.exitCriteria.map((_, item) => exitId(n, item + 1))
  };
});

const allIdsOfYear = (ids) => [...ids.skills, ...ids.phases.flat(), ...ids.projects, ...ids.exit];

// A progress key says which checkboxes a progress bar counts:
//   "all"        every checkbox          "y2"          all of year 2
//   "y2-p3"      phase 3 of year 2       "y2-phases"   all phase tasks of year 2
//   "y2-skills", "y2-projects", "y2-exit"  one section of year 2
function idsForKey(key) {
  if (key === "all") return checkboxIds.flatMap(allIdsOfYear);
  const [yearPart, part] = key.split("-");
  const ids = checkboxIds[Number(yearPart.slice(1)) - 1];
  if (!part) return allIdsOfYear(ids);
  if (/^p\d$/.test(part)) return ids.phases[Number(part[1]) - 1];
  if (part === "phases") return ids.phases.flat();
  return ids[part];
}

function percentDone(key) {
  const ids = idsForKey(key);
  if (ids.length === 0) return 0;
  const done = ids.filter((id) => state.checked[id]).length;
  return Math.round((100 * done) / ids.length);
}

function updateProgressBars() {
  document.querySelectorAll("[data-progress]").forEach((bar) => {
    const percent = percentDone(bar.dataset.progress);
    bar.querySelector(".fill").style.width = percent + "%";
    bar.querySelector(".percent").textContent = percent + "%";
  });
}

/* =====================================================================
   4. SMALL HTML HELPERS
   ===================================================================== */

const $ = (selector) => document.querySelector(selector);

function escapeHtml(text) {
  return String(text).replace(/[&<>]/g, (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[ch]));
}

function checkbox(id, label) {
  const checked = state.checked[id] ? "checked" : "";
  return `<label class="check"><input type="checkbox" data-id="${id}" ${checked}><span>${label}</span></label>`;
}

function section(title, html) {
  return `<section class="section"><h3>${title}</h3>${html}</section>`;
}

function chips(items) {
  return `<div class="chips">${items.map((item) => `<span>${item}</span>`).join("")}</div>`;
}

function progressBar(key, label = "") {
  return `<div class="progress" data-progress="${key}">
    <div class="bar"><div class="fill"></div></div>
    <small>${label} <b class="percent"></b></small>
  </div>`;
}

// Year 4 only: five selectable specialization cards.
function specializationSection(year) {
  const cards = year.specializationTracks.map((track) => {
    const selected = state.track === track.name ? " selected" : "";
    return `<button class="card specialization${selected}" data-track="${track.name}">
      <h4>${track.name}</h4>
      <p>${track.skills}</p>
      <p><b>Certifications:</b> ${track.certifications}</p>
      <p><b>Roles:</b> ${track.roles}</p>
      <p><b>Capstone:</b> ${track.capstone}</p>
    </button>`;
  }).join("");
  return section("Specialization track (choose one)", `<div class="grid">${cards}</div>`);
}

function yearPage(index) {
  const year = YEARS[index];
  const n = index + 1;
  const totalHours = year.weeklyTimeSplit.reduce((sum, row) => sum + row.hours, 0);

  const header = `
    <header class="hero compact">
      <h1>Year ${n}: ${year.theme}</h1>
      <p>${year.goal}</p>
      <p class="mono">Suggested weekly hours: ${year.weeklyHours}</p>
      <div class="progress-wide">${progressBar("y" + n, "Year progress")}</div>
      <p class="mono">Hours and counts are suggested planning defaults. Months count from the start of the academic year. Reduce hours in exam weeks.</p>
    </header>`;

  const sections = [];

  if (year.specializationTracks) sections.push(specializationSection(year));

  // 1. Skills: grouped by area, every skill is a checkbox
  const skillGroups = Object.entries(year.skills).map(([groupName, skills], group) =>
    `<h4>${groupName}</h4>` +
    skills.map((skill, item) => checkbox(skillId(n, group + 1, item + 1), skill)).join("")
  ).join("");
  sections.push(section("1. Skills in detail", skillGroups + progressBar(`y${n}-skills`, "Skills")));

  // 2. Phase plan: four accordions, the first one open
  const phases = year.phases.map((phase, p) => {
    const tasks = phase.tasks.map((task, t) => checkbox(taskId(n, p + 1, t + 1), task)).join("");
    return `<details${p === 0 ? " open" : ""}>
      <summary>Phase ${p + 1} (Months ${phase.months}): ${phase.focus}</summary>
      ${tasks}
      <p><b>Deliverable:</b> ${phase.deliverable}</p>
      ${progressBar(`y${n}-p${p + 1}`, "Phase progress")}
    </details>`;
  }).join("");
  sections.push(section("2. Phase plan", phases));

  sections.push(section("3. Tools and platforms", chips(year.tools)));
  sections.push(section("4. Free resources (names only; verify on the official site)", chips(year.resources)));

  // 5. Projects
  const projects = year.projects.map((project, item) => checkbox(projectId(n, item + 1), project)).join("");
  sections.push(section("5. Projects and deliverables", projects));

  sections.push(section("6. Certifications", `<p>${year.certifications}</p>`));

  // 7. Weekly time split: table with a computed total
  const rows = year.weeklyTimeSplit.map((row) => `<tr><td>${row.label}</td><td>${row.hours} h</td></tr>`).join("");
  sections.push(section("7. Weekly time split (suggested)",
    `<table>${rows}<tr><th>Total</th><th>${totalHours} h</th></tr></table>`));

  // 8. Exit criteria
  const exits = year.exitCriteria.map((criterion, item) => checkbox(exitId(n, item + 1), criterion)).join("");
  sections.push(section("8. Done when", exits));

  // 9. Self-check: click a question to reveal the answer
  const questions = year.selfCheck.map((item) =>
    `<details><summary>${item.question}</summary><p>${item.answer}</p></details>`).join("");
  sections.push(section("9. Self-check questions (answer without notes first)", questions));

  const mistakes = year.commonMistakes.map((mistake) => `<li>${mistake}</li>`).join("");
  sections.push(section("10. Common mistakes to avoid", `<ul>${mistakes}</ul>`));

  // 11. Notes box, saved per year
  sections.push(section("11. Notes",
    `<textarea data-notes="y${n}" aria-label="Notes">${escapeHtml(state.notes["y" + n] || "")}</textarea>`));

  const footer = `<footer class="legal">Test only systems you own or have written permission to test. Unauthorized access is an offense under the Information Technology Act, 2000 (see Sections 43 and 66).</footer>`;

  return header + `<div class="wrap">${sections.join("")}</div>` + footer;
}

function progressPage() {
  const perYear = YEARS.map((year, index) => {
    const n = index + 1;
    const bySection = [
      ["skills", "By section: skills"],
      ["phases", "By section: phase tasks"],
      ["projects", "By section: projects"],
      ["exit", "By section: exit criteria"]
    ].map(([part, label]) => progressBar(`y${n}-${part}`, label)).join("");
    const byPhase = year.phases.map((phase, p) =>
      progressBar(`y${n}-p${p + 1}`, `Phase ${p + 1}: ${phase.focus}`)).join("");
    return section(`Year ${n}: ${year.theme}`, progressBar("y" + n, "Year") + bySection + byPhase);
  }).join("");

  const exportImport = section("Export / import", `
    <p>Export fills the box with JSON to copy and keep. To import, paste JSON and press Import.</p>
    <textarea id="json-box" aria-label="Progress JSON"></textarea>
    <p>
      <button class="button" id="export-button">Export</button>
      <button class="button" id="import-button">Import</button>
      <small id="message"></small>
    </p>`);

  return `
    <header class="hero compact">
      <h1>Progress</h1>
      <div class="progress-wide">${progressBar("all", "Overall")}</div>
    </header>
    <div class="wrap">${perYear}${exportImport}</div>`;
}

/* =====================================================================
   6. ROUTER
   The page is chosen by the URL hash: #/ (home), #/y1 to #/y4, #/progress.
   ===================================================================== */

function showPage() {
  const route = location.hash.slice(2);          // "#/y2" -> "y2"
  const yearMatch = /^y([1-4])$/.exec(route);

  if (yearMatch) $("#app").innerHTML = yearPage(Number(yearMatch[1]) - 1);
  else if (route === "progress") $("#app").innerHTML = progressPage();
  else $("#app").innerHTML = homePage();

  scrollTo(0, 0);
  updateProgressBars();
  $("#nav").classList.remove("menu-open");
}

/* =====================================================================
   7. USER ACTIONS
   One listener per event type handles the whole page (event delegation),
   so it keeps working after a page is re-rendered.
   ===================================================================== */

// Tick or untick a checkbox.
document.addEventListener("change", (event) => {
  const id = event.target.dataset.id;
  if (!id) return;
  if (event.target.checked) state.checked[id] = true;
  else delete state.checked[id];
  saveState();
  updateProgressBars();
});

// Typing in a notes box.
document.addEventListener("input", (event) => {
  const year = event.target.dataset.notes;
  if (!year) return;
  state.notes[year] = event.target.value;
  saveState();
});

document.addEventListener("click", (event) => {
  const target = event.target;
  const trackCard = target.closest("[data-track]");

  // Year 4: choose a specialization.
  if (trackCard) {
    state.track = trackCard.dataset.track;
    saveState();
    document.querySelectorAll("[data-track]").forEach((card) =>
      card.classList.toggle("selected", card.dataset.track === state.track));
  }

  switch (target.id) {
    case "export-button": exportProgress(); break;
    case "import-button": importProgress(); break;
    case "reset-button": $("#confirm").hidden = false; break;
    case "confirm-no": $("#confirm").hidden = true; break;
    case "confirm-yes": resetProgress(); break;
    case "menu-button": $("#nav").classList.toggle("menu-open"); break;
    case "theme-button": toggleTheme(); break;
  }
});

function exportProgress() {
  const box = $("#json-box");
  box.value = JSON.stringify({ c: state.checked, n: state.notes, sp: state.track }, null, 1);
  box.select();
  try { navigator.clipboard.writeText(box.value); } catch (error) {}
  $("#message").textContent = "Exported";
}

function importProgress() {
  try {
    const data = JSON.parse($("#json-box").value);
    if (!data || typeof data.c !== "object") throw new Error("not a progress file");
    state.checked = data.c;
    state.notes = data.n || {};
    state.track = data.sp || null;
    saveState();
    showPage();
    $("#message").textContent = "Imported";
  } catch (error) {
    $("#message").textContent = "Invalid JSON";
  }
}

function resetProgress() {
  state.checked = {};
  state.notes = {};
  state.track = null;        // the theme setting is kept
  saveState();
  $("#confirm").hidden = true;
  showPage();
}

// Print: open every accordion so nothing is hidden on paper.
addEventListener("beforeprint", () =>
  document.querySelectorAll("details").forEach((d) => (d.open = true)));

/* =====================================================================
   8. THEME AND HALFTONE BACKGROUND
   ===================================================================== */

function applyTheme() {
  const systemIsDark = matchMedia("(prefers-color-scheme: dark)").matches;
  document.documentElement.dataset.theme = state.theme || (systemIsDark ? "dark" : "light");
  drawTexture();   // dot color depends on the theme
}

function toggleTheme() {
  const isDark = document.documentElement.dataset.theme === "dark";
  state.theme = isDark ? "light" : "dark";
  saveState();
  applyTheme();
}

// Draws dots on a canvas: large at the screen edges, none in the center.
function drawTexture() {
  const canvas = $("#texture");
  const ctx = canvas.getContext("2d");
  const width = (canvas.width = innerWidth);
  const height = (canvas.height = innerHeight);
  const spacing = 8;

  ctx.clearRect(0, 0, width, height);
  ctx.fillStyle = "rgb(" + getComputedStyle(document.documentElement).getPropertyValue("--dot") + ")";

  for (let col = 0; col <= width / spacing; col++) {
    for (let row = 0; row <= height / spacing; row++) {
      // Distance from the screen center: 0 in the middle, 1 at the edges.
      const dx = (col * spacing - width / 2) / (width / 2);
      const dy = (row * spacing - height / 2) / (height / 2);
      const distance = Math.min(1, Math.hypot(dx, dy) / 1.2);

      // Fixed pseudo-random value (0 to 1) so the pattern is stable between redraws.
      const noise = Math.sin(col * 12.9898 + row * 78.233) * 43758.5453;
      const random = noise - Math.floor(noise);

      const radius = Math.pow(Math.max(0, distance - 0.5) / 0.5, 1.6) * spacing * 0.55 * (0.6 + 0.4 * random);
      if (radius > 0.5) {
        ctx.beginPath();
        ctx.arc(col * spacing + (row % 2) * spacing / 2, row * spacing, radius, 0, Math.PI * 2);
        ctx.fill();
      }
    }
  }
}

/* =====================================================================
   9. START
   ===================================================================== */

addEventListener("hashchange", showPage);
addEventListener("resize", drawTexture);
loadState();
applyTheme();
showPage();

  </script>
</body>
</html>
