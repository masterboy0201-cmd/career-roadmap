const Y=ROADMAP.years,$=s=>document.querySelector(s),app=$('#app');
let S={c:{},n:{},sp:null,t:null};
try{Object.assign(S,JSON.parse(localStorage.getItem('cr1')||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem('cr1',JSON.stringify(S))}catch(e){}};
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const A=Y.map((y,i)=>{const n=i+1;return{sk:Object.values(y.skills).flatMap((a,g)=>a.map((_,k)=>`y${n}-s${g+1}-${k+1}`)),ph:y.phases.map((p,j)=>p.tasks.map((_,k)=>`y${n}-p${j+1}-t${k+1}`)),pr:y.projects.map((_,k)=>`y${n}-pr${k+1}`),ex:y.exit.map((_,k)=>`y${n}-e${k+1}`)}});
const flat=a=>[...a.sk,...a.ph.flat(),...a.pr,...a.ex];
const L=k=>{if(k=='all')return A.flatMap(flat);const[p,s]=k.split('-'),a=A[p[1]-1];return !s?flat(a):/^p\d$/.test(s)?a.ph[s[1]-1]:s=='ph'?a.ph.flat():a[s]};
const pct=k=>{const l=L(k);return l.length?Math.round(100*l.filter(i=>S.c[i]).length/l.length):0};
const bar=(k,l)=>`<div class="pr" data-k="${k}"><div class="pb"><i></i></div><small>${l||''} <b></b></small></div>`;
const upd=()=>document.querySelectorAll('[data-k]').forEach(e=>{const p=pct(e.dataset.k);e.querySelector('i').style.width=p+'%';e.querySelector('b').textContent=p+'%'});
const cb=(id,t)=>`<label class="c"><input type="checkbox" data-id="${id}" ${S.c[id]?'checked':''}><span>${t}</span></label>`;
const sec=(t,h)=>`<section class="s"><h3>${t}</h3>${h}</section>`;
const chips=a=>`<div class="chips">${a.map(x=>`<span>${x}</span>`).join('')}</div>`;
const shield=`<svg class="sh" viewBox="0 0 600 420" aria-hidden="true"><defs><pattern id="d1" width="9" height="9" patternUnits="userSpaceOnUse"><circle cx="4.5" cy="4.5" r="3.2" fill="currentColor"/></pattern><pattern id="d2" width="7" height="7" patternUnits="userSpaceOnUse"><circle cx="3.5" cy="3.5" r="1.4" fill="currentColor"/></pattern></defs><path d="M300 10L560 90V230C560 340 430 400 300 450C170 400 40 340 40 230V90Z" fill="url(#d1)"/><path d="M300 50L520 112V228C520 316 410 366 300 408C190 366 80 316 80 228V112Z" fill="url(#d2)" stroke="currentColor" stroke-width="2"/><circle class="kh" cx="300" cy="200" r="44"/><path class="kh" d="M280 230H320L336 330H264Z"/></svg>`;

const home=()=>`<header class="hero home"><h1>Four Years.<br>One Path To Job-Ready.</h1><p>A year-by-year roadmap for cybersecurity students: fundamentals, programming, projects, interviews.</p><a class="b p" href="#/y1">Start Year 1 ↗</a>${shield}</header>
<div class="strip"><small>Practice on</small>${['TryHackMe','Hack The Box','OverTheWire','picoCTF','LeetCode','GitHub'].map(x=>`<span>${x}</span>`).join('')}</div>
<section class="w"><div class="grid">${Y.map((y,i)=>`<div class="card"><div class="num">0${i+1}</div><h3>${y.theme}</h3><ul>${y.out.map(o=>`<li>${o}</li>`).join('')}</ul>${bar('y'+(i+1))}<a class="b" href="#/y${i+1}">View Year ↗</a></div>`).join('')}</div></section>
<section class="w"><h2>Timeline</h2><ol class="tl">${Y.map((y,i)=>`<li><b>Year ${i+1}: ${y.theme}</b><span>${y.goal}</span></li>`).join('')}</ol></section>`;

function year(i){const y=Y[i],n=i+1,tot=y.split.reduce((a,b)=>a+b[1],0);
return `<header class="hero sm"><h1>Year ${n}: ${y.theme}</h1><p>${y.goal}</p><p class="mono">Suggested weekly hours: ${y.hrs}</p><div class="pw">${bar('y'+n,'Year progress')}</div><p class="mono">Hours and counts are suggested planning defaults. Months count from the start of the academic year. Reduce hours in exam weeks.</p></header><div class="w">`
+(y.tracks?sec('Specialization track (choose one)',`<div class="grid">${y.tracks.map(t=>`<button class="card tk${S.sp==t.n?' on':''}" data-sp="${t.n}"><h4>${t.n}</h4><p>${t.s}</p><p><b>Certifications:</b> ${t.c}</p><p><b>Roles:</b> ${t.r}</p><p><b>Capstone:</b> ${t.k}</p></button>`).join('')}</div>`):'')
+sec('1. Skills in detail',Object.entries(y.skills).map(([g,l],gi)=>`<h4>${g}</h4>`+l.map((t,k)=>cb(`y${n}-s${gi+1}-${k+1}`,t)).join('')).join('')+bar(`y${n}-sk`,'Skills'))
+sec('2. Phase plan',y.phases.map((p,j)=>`<details${j?'':' open'}><summary>Phase ${j+1} (Months ${p.m}): ${p.f}</summary>${p.tasks.map((t,k)=>cb(`y${n}-p${j+1}-t${k+1}`,t)).join('')}<p><b>Deliverable:</b> ${p.d}</p>${bar(`y${n}-p${j+1}`,'Phase progress')}</details>`).join(''))
+sec('3. Tools and platforms',chips(y.tools))
+sec('4. Free resources (names only; verify on the official site)',chips(y.res))
+sec('5. Projects and deliverables',y.projects.map((t,k)=>cb(`y${n}-pr${k+1}`,t)).join(''))
+sec('6. Certifications',`<p>${y.certs}</p>`)
+sec('7. Weekly time split (suggested)',`<table>${y.split.map(([k,h])=>`<tr><td>${k}</td><td>${h} h</td></tr>`).join('')}<tr><th>Total</th><th>${tot} h</th></tr></table>`)
+sec('8. Done when',y.exit.map((t,k)=>cb(`y${n}-e${k+1}`,t)).join(''))
+sec('9. Self-check questions (answer without notes first)',y.qa.map(([q,a])=>`<details><summary>${q}</summary><p>${a}</p></details>`).join(''))
+sec('10. Common mistakes to avoid',`<ul>${y.bad.map(b=>`<li>${b}</li>`).join('')}</ul>`)
+sec('11. Notes',`<textarea data-n="y${n}" aria-label="Notes">${esc(S.n['y'+n]||'')}</textarea>`)
+`</div><footer class="lg">Test only systems you own or have written permission to test. Unauthorized access is an offense under the Information Technology Act, 2000 (see Sections 43 and 66).</footer>`}

const prog=()=>`<header class="hero sm"><h1>Progress</h1><div class="pw">${bar('all','Overall')}</div></header><div class="w">`
+Y.map((y,i)=>{const n=i+1;return sec(`Year ${n}: ${y.theme}`,bar('y'+n,'Year')+[['sk','By section: skills'],['ph','By section: phase tasks'],['pr','By section: projects'],['ex','By section: exit criteria']].map(([s,l])=>bar(`y${n}-${s}`,l)).join('')+y.phases.map((p,j)=>bar(`y${n}-p${j+1}`,`Phase ${j+1}: ${p.f}`)).join(''))}).join('')
+sec('Export / import',`<p>Export fills the box with JSON to copy and keep. To import, paste JSON and press Import.</p><textarea id="io" aria-label="Progress JSON"></textarea><p><button class="b" id="ex">Export</button> <button class="b" id="im">Import</button> <small id="ms"></small></p>`)+`</div>`;

function route(){const h=location.hash.slice(2),m=/^y([1-4])$/.exec(h);app.innerHTML=m?year(m[1]-1):h=='progress'?prog():home();scrollTo(0,0);upd();$('#nv').classList.remove('open')}
addEventListener('hashchange',route);
addEventListener('beforeprint',()=>document.querySelectorAll('details').forEach(d=>d.open=true));
document.addEventListener('change',e=>{const t=e.target,id=t.dataset.id;if(id){t.checked?S.c[id]=1:delete S.c[id];save();upd()}});
document.addEventListener('input',e=>{const t=e.target;if(t.dataset.n){S.n[t.dataset.n]=t.value;save()}});
document.addEventListener('click',e=>{const t=e.target,sp=t.closest('[data-sp]');
 if(sp){S.sp=sp.dataset.sp;save();document.querySelectorAll('[data-sp]').forEach(c=>c.classList.toggle('on',c.dataset.sp==S.sp))}
 if(t.id=='ex'){const o=$('#io');o.value=JSON.stringify({c:S.c,n:S.n,sp:S.sp},null,1);o.select();try{navigator.clipboard.writeText(o.value)}catch(x){}$('#ms').textContent='Exported'}
 if(t.id=='im'){try{const o=JSON.parse($('#io').value);if(!o||typeof o.c!='object')throw 0;S.c=o.c;S.n=o.n||{};S.sp=o.sp||null;save();route();$('#ms').textContent='Imported'}catch(x){$('#ms').textContent='Invalid JSON'}}
 if(t.id=='rs')$('#cf').hidden=false;if(t.id=='no')$('#cf').hidden=true;
 if(t.id=='yes'){S={c:{},n:{},sp:null,t:S.t};save();$('#cf').hidden=true;route()}
 if(t.id=='mb')$('#nv').classList.toggle('open');
 if(t.id=='th'){S.t=document.documentElement.dataset.t=='dark'?'light':'dark';save();theme()}});

function tex(){const c=$('#g'),x=c.getContext('2d'),w=c.width=innerWidth,h=c.height=innerHeight,s=8;x.clearRect(0,0,w,h);
 x.fillStyle='rgb('+getComputedStyle(document.documentElement).getPropertyValue('--dot')+')';
 for(let i=0;i<=w/s;i++)for(let j=0;j<=h/s;j++){const d=Math.min(1,Math.hypot((i*s-w/2)/(w/2),(j*s-h/2)/(h/2))/1.2),n=Math.sin(i*12.9898+j*78.233)*43758.5453;
  const r=Math.pow(Math.max(0,d-.5)/.5,1.6)*s*.55*(.6+.4*(n-Math.floor(n)));
  if(r>.5){x.beginPath();x.arc(i*s+(j%2)*s/2,j*s,r,0,7);x.fill()}}}
function theme(){document.documentElement.dataset.t=S.t||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');tex()}
addEventListener('resize',tex);theme();route();
</script></body></html>
